# 울트론 모바일을 Android 설치 파일(APK)로 빌드한다.
# 빌드가 끝나면 Releases 의 "android-latest" 에 ULTRON.apk 로 올라가서 휴대폰에서 바로 받을 수 있다:
#   https://github.com/<저장소>/releases/download/android-latest/ULTRON.apk
name: Mobile (Android APK)

on:
  push:
    branches: [main, "claude/**"]
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PultronVersionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ULTRON.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-apk
          path: mobile/ULTRON.apk
      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create android-latest ULTRON.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ULTRON 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 ULTRON.apk 를 눌러 받은 뒤 열어서 설치하세요. 처음이면 '출처를 알 수 없는 앱 설치'를 허용해야 합니다. (브랜치: ${GITHUB_REF_NAME}, 커밋: ${GITHUB_SHA::7})"
